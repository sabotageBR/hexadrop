<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="description" content="Hexa Drop - break the tower and bring the hexagon down to the platform." />
<title>Hexa Drop</title>
<!-- Unico script externo permitido pela Poki. -->
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='30,16 23,28 9,28 2,16 9,4 23,4' fill='%231a0b2e' stroke='%234fc8ff' stroke-width='3' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffffff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./src/ui/game.css" />
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">

  <!-- ---------------------------------------------------------- inicio -->
  <!-- Tres faixas que nao se tocam: nome do jogo em cima, a torre do mundo
       aparecendo pela faixa vazia do meio, e as opcoes embaixo. A faixa do meio
       nao tem conteudo de proposito - e o buraco por onde a cena aparece, e
       fitHomeScene() mede as outras duas para enquadrar a torre ali dentro. -->
  <section class="screen" id="s-home">
    <div class="home-top" id="homeTop">
      <div class="hud-top">
        <div class="stat hearts"><span class="ico">&#10084;</span><span id="homeHearts">5</span></div>
        <div class="stat coins"><span class="ico">&#9679;</span><span id="homeCoins">0</span></div>
        <div class="grow"></div>
        <button class="iconbtn" id="btnSettings" aria-label="Ajustes">&#9881;</button>
      </div>
      <h1 class="logo">
        <!-- width/height reservam a altura antes de a imagem chegar: sem eles
             fitHomeScene() mede a faixa de cima menor do que ela vai ficar e a
             torre nasce fora do lugar. -->
        <img id="homeLogo" src="./src/ui/logo.webp" width="900" height="768" alt="Hexa Drop" />
      </h1>
      <p class="tagline" id="tagline"></p>
    </div>

    <div class="home-stage"></div>

    <div class="home-base" id="homeBase">
      <p class="world-loc" id="homeWorld"></p>
      <div class="world-dots" id="homeWorldDots"></div>
      <p class="world-hint" id="homeSwipeHint"></p>
      <div class="home-actions">
        <button class="btn primary big wide drop" id="btnPlay"></button>
        <div class="row">
          <button class="btn" style="flex:1" id="btnMap"></button>
          <button class="btn" style="flex:1" id="btnShop"></button>
        </div>
      </div>
      <div class="hud-bottom home-foot">
        <span class="rank-label" id="rankLabel">Rank</span>
        <span class="rank-value" id="homeRank">0</span>
        <div class="meter"><i id="homeRankBar"></i></div>
        <div class="stat"><span class="ico" style="color:var(--gold)">&#9733;</span><span id="homeStars">0</span><small id="homeStarsMax">/300</small></div>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------ mapa -->
  <section class="screen" id="s-map">
    <div class="hud-top">
      <button class="btn icon" id="mapBack">&#8592;</button>
      <div class="level-pill" id="mapTitle"></div>
      <div class="badge coins"><span class="ico">&#9679;</span><span id="mapCoins">0</span></div>
    </div>
    <div class="map-scroll" id="mapScroll"></div>
    <button class="map-here" id="mapHere" aria-label="Fase atual">&#9662;</button>
    <div class="hud-bottom">
      <button class="btn" id="btnDaily"></button>
      <div class="grow"></div>
      <div class="badge hearts"><span class="ico">&#10084;</span><span id="mapHearts">5</span></div>
    </div>
  </section>

  <!-- ------------------------------------------------------------ jogo -->
  <section class="screen pass" id="s-game">
    <!-- Fio e sombra: sem caixa em volta de nada. Um degrade escurece a borda
         e um fio fino marca o limite, entao o HUD nao rouba area do jogo. -->
    <div class="shade top"></div>
    <div class="hud-top bare">
      <button class="iconbtn" id="gameBack" aria-label="Voltar">&#8592;</button>
      <div class="grow"></div>
      <div class="level-name" id="gameLevel"></div>
      <div class="grow"></div>
      <!-- A bolsa fica a vista DENTRO da fase: e onde as moedas do premio
           pousam, e e o que permite a recompensa existir sem um cartao. -->
      <div class="stat coins"><span class="ico">&#9679;</span><span id="gameCoins">0</span></div>
      <div class="stat hearts"><span class="ico">&#10084;</span><span id="gameHearts">5</span></div>
      <button class="iconbtn" id="gamePause" aria-label="Pausar">&#9208;</button>
    </div>
    <div class="starrow" id="gameStars"><i></i><i></i><i></i></div>
    <!-- Contador da celebracao de fim de fase. Fica sobre a cena, sem cartao:
         o que interessa ver e a torre estourando atras dele. -->
    <div class="bonus" id="bonusBox" hidden>
      <span class="bonus-label" id="bonusLabel"></span>
      <b class="bonus-count" id="bonusCount">0</b>
      <span class="bonus-gain" id="bonusGain"></span>
    </div>
    <!-- Selo do fluxo continuo: o recibo da fase vencida, sobre a cena e sem
         botao nenhum. Sai sozinho quando a fase seguinte entra. Nao repete as
         estrelas: as do HUD acendem durante a jogada e ja estao logo acima. -->
    <div class="flow" id="flowSeal" hidden>
      <b class="flow-coins" id="flowCoins"></b>
      <span class="flow-what" id="flowWhat"></span>
    </div>
    <div class="grow"></div>
    <div class="shade bottom"></div>
    <div class="hud-bottom bare">
      <div class="grow"></div>
      <!-- O botao padrao acompanha o de video, do mesmo tamanho e ao lado. -->
      <button class="btn ghost" id="gameRestart" hidden></button>
      <button class="btn ad" id="gameHint" hidden></button>
    </div>
  </section>

  <!-- --------------------------------------------------------- vitoria -->
  <section class="screen" id="s-win">
    <div class="veil"></div>
    <div class="card end-card">
      <img class="card-logo" src="./src/ui/logo.webp" width="900" height="768" alt="Hexa Drop" />
      <h2 id="winTitle"></h2>
      <div class="starrow" id="winStars"><i></i><i></i><i></i></div>
      <div class="rewards">
        <div class="reward"><b id="winCoins">0</b><span id="winCoinsLbl"></span></div>
        <div class="reward"><b id="winXp">0</b><span id="winXpLbl"></span></div>
      </div>
      <div class="bonus-line" id="winBonus" hidden>
        <span class="bonus-line-lbl" id="winBonusLbl"></span>
        <span class="bonus-line-what" id="winBonusWhat"></span>
        <b class="bonus-line-val" id="winBonusValue"></b>
      </div>
      <p id="winNote"></p>
      <div class="row">
        <!-- Jogar de novo fica AO LADO de "proxima", e nao escondido no menu:
             quem tirou uma estrela so quer repetir na hora, sem passar pela
             home e procurar a fase no mapa. -->
        <button class="btn" id="winRetry"></button>
        <button class="btn primary big" id="winNext"></button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="winHome"></button>
        <button class="btn ad" id="winDouble"></button>
      </div>
      <!-- A bolsa e o alvo das moedas que voam. O contador da home fica em tela
           escondida durante a vitoria, e mirar nele mandava tudo para (0,0). -->
      <div class="row foot-row">
        <div class="purse"><span class="ico">&#9679;</span><b id="winPurse">0</b><span id="winPurseLbl"></span></div>
      </div>
    </div>
  </section>

  <!-- --------------------------------------------------------- derrota -->
  <section class="screen" id="s-lose">
    <div class="veil"></div>
    <div class="card end-card">
      <img class="card-logo" src="./src/ui/logo.webp" width="900" height="768" alt="Hexa Drop" />
      <h2 id="loseTitle"></h2>
      <p id="loseNote"></p>
      <!-- Pular fase fica AO LADO de "tentar de novo", que e maior e
           gratuito: exigencia da Poki e, aqui, tambem a verdade do jogo -
           pular nao da estrela, entao o portao do mundo seguinte continua
           cobrando o que cobrava. O video adianta o caminho, nao o progresso.
           Nao ha botao de encher coracoes: eles voltam sozinhos com o tempo e
           sem eles o jogador continua jogando, so com metade do premio. -->
      <div class="row">
        <button class="btn primary big" id="loseRetry"></button>
        <button class="btn" id="loseSkip"></button>
      </div>
      <p class="fineprint" id="loseSkipNote"></p>
      <div class="row" style="margin-top:10px">
        <button class="btn wide" id="loseShuffle"></button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn wide" id="loseHome"></button>
      </div>
    </div>
  </section>

  <!-- ----------------------------------------------------------- pausa -->
  <section class="screen" id="s-pause">
    <div class="veil"></div>
    <div class="card pause-card">
      <h2 id="pauseTitle"></h2>
      <p class="pause-where" id="pauseWhere"></p>
      <div class="starrow" id="pauseStars"><i></i><i></i><i></i></div>
      <p class="pause-taps" id="pauseTaps"></p>
      <!-- Pilha de botoes precisa de classe propria: com flex-direction trocado
           por estilo em linha, o `flex-basis` da fileira passava a valer na
           ALTURA e os tres viravam pilulas de 130px. -->
      <div class="col">
        <button class="btn primary big wide" id="pauseResume"></button>
        <button class="btn wide" id="pauseRestart"></button>
        <button class="btn wide" id="pauseHome"></button>
      </div>
      <div class="pause-toggles">
        <button class="toggle" id="pauseSound" aria-pressed="true"><span class="ico">&#9834;</span><span id="pauseSoundLbl"></span></button>
        <button class="toggle" id="pauseMusic" aria-pressed="true"><span class="ico">&#9835;</span><span id="pauseMusicLbl"></span></button>
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------ loja -->
  <section class="screen" id="s-shop">
    <div class="hud-top">
      <button class="btn icon" id="shopBack">&#8592;</button>
      <div class="level-pill" id="shopTitle"></div>
      <div class="badge coins"><span class="ico">&#9679;</span><span id="shopCoins">0</span></div>
    </div>
    <div class="tabs" style="margin-top:12px">
      <button class="tab on" id="tabSkins"></button>
      <button class="tab" id="tabUpgrades"></button>
      <button class="tab" id="tabBoosts"></button>
    </div>
    <div class="map-scroll"><div class="shop-list" id="shopList"></div></div>
  </section>

  <!-- --------------------------------------------------------- ajustes -->
  <section class="screen" id="s-settings">
    <div class="veil"></div>
    <div class="card" style="text-align:left">
      <h2 id="setTitle" style="text-align:center"></h2>
      <div class="settings-row"><label id="lblSound"></label><div class="seg" id="segSound"></div></div>
      <div class="settings-row"><label id="lblMusic"></label><div class="seg" id="segMusic"></div></div>
      <div class="settings-row"><label id="lblQuality"></label><div class="seg" id="segQuality"></div></div>
      <div class="settings-row"><label id="lblLang"></label><div class="seg" id="segLang"></div></div>
      <p id="setStorage" style="margin:12px 0 0; font-size:12px"></p>
      <div class="row" style="margin-top:14px">
        <button class="btn" id="setReset"></button>
        <button class="btn primary" id="setClose"></button>
      </div>
    </div>
  </section>

  <!-- Corte entre fases. A troca de cena remonta o cache de sprites e troca a
       torre no mesmo quadro; sem este vao escuro a passagem e um salto seco. -->
  <div class="wipe" id="wipe"></div>

</div>

<div class="tut hide" id="tut"></div>
<div class="toast" id="toast"></div>

<div id="loader">
  <div class="loader-inner">
    <h1 class="logo" style="font-size:40px"><span>HEXA DROP</span></h1>
    <div class="loader-bar"><i id="loaderBar"></i></div>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
