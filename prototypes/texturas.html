<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hexa Drop — texturas derivadas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #07102c; color: #f4f7ff; font: 16px/1.45 system-ui, sans-serif; }
  a { color: #3dd0ff; }
  header {
    position: sticky; top: 0; z-index: 4;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px;
    padding: 14px 20px; background: linear-gradient(#07102cee, #07102c88 70%, transparent);
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: clamp(20px, 4vw, 28px); letter-spacing: -0.03em; }
  header p { margin: 0; color: rgba(244,247,255,0.62); font-size: 14px; flex: 1; min-width: 220px; }
  .back {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.16); color: inherit; text-decoration: none;
    background: rgba(255,255,255,0.06);
  }
  .stage {
    margin: 8px 20px 10px;
    border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    background: #0a1a48;
  }
  .stage canvas { display: block; width: 100%; height: auto; }
  .stage-cap {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 10px 16px; background: rgba(0,0,0,0.28); font-size: 13px; color: rgba(244,247,255,0.7);
  }
  .stage-cap b { color: #fff; font-size: 15px; }
  .list { padding: 0 20px 56px; max-width: 1100px; margin: 0 auto; }
  .fam { margin: 22px 0 10px; font: 800 13px/1 system-ui; letter-spacing: 0.14em; text-transform: uppercase; color: #ff4eb6; }
  .fam-grid { display: grid; gap: 12px; }
  .card {
    display: grid; grid-template-columns: 72px 1fr; gap: 0 14px;
    padding: 12px; border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    cursor: pointer; text-align: left; color: inherit; font: inherit;
  }
  .card:hover { border-color: rgba(255,255,255,0.28); }
  .card.on { border-color: #ff4eb6; box-shadow: 0 0 0 2px #ff4eb6aa; background: rgba(255,78,182,0.08); }
  .num {
    grid-row: 1 / span 2; align-self: center;
    font: 800 26px/1 ui-monospace, monospace; color: rgba(255,255,255,0.28);
  }
  .card.on .num { color: #ff4eb6; }
  .card h2 { margin: 0; font-size: 16px; }
  .card p { margin: 2px 0 8px; font-size: 13px; color: rgba(244,247,255,0.58); }
  .card canvas { width: 100%; height: auto; display: block; border-radius: 10px; background: #07102c; }
  @media (max-width: 640px) {
    .card { grid-template-columns: 48px 1fr; }
    .num { font-size: 20px; }
  }
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html" title="Jogo">←</a>
  <div>
    <h1>Derivados para aprovar</h1>
    <p>Toon, gelatina, lego e pixel — três variações de cada. Toque para ver na torre.</p>
  </div>
</header>

<section class="stage">
  <canvas id="stage" width="860" height="520"></canvas>
  <div class="stage-cap"><span>Torre de amostra · <b id="stageName">—</b></span><span id="stageHint">toque um modelo abaixo</span></div>
</section>

<div class="list" id="list"></div>

<script type="module" src="./texturas.js"></script>
</body>
</html>
